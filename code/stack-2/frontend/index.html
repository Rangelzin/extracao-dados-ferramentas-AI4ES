<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management - Gestão de Quartos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container flex">
            <h1 class="logo">🏨 Hotel <span>Reserva</span></h1>
            <nav>
                <button id="btnNovoQuarto" class="btn btn-green">Novo Quarto</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Formulário de Cadastro/Edição (Escondido por padrão) -->
        <section id="formQuartoSection" class="card hidden">
            <h2 id="formTitle">Cadastrar Novo Quarto</h2>
            <form id="quartoForm">
                <input type="hidden" id="editOriginalNumero">
                <div class="grid">
                    <div class="form-group">
                        <label>Número do Quarto</label>
                        <input type="text" id="numero" required placeholder="Ex: 101">
                    </div>
                    <div class="form-group">
                        <label>Capacidade (Pessoas)</label>
                        <input type="number" id="capacidade" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo do Quarto</label>
                        <select id="tipo">
                            <option value="BASICO">Básico</option>
                            <option value="MODERNO">Moderno</option>
                            <option value="LUXO">Luxo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Preço por Diária (R$)</label>
                        <input type="number" step="0.01" id="precoDiaria" required>
                    </div>
                </div>

                <div class="section-title">Comodidades</div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="temFrigobar"> Frigobar</label>
                    <label><input type="checkbox" id="temCafeIncluso"> Café da Manhã</label>
                    <label><input type="checkbox" id="temArCondicionado"> Ar-Condicionado</label>
                    <label><input type="checkbox" id="temTV"> TV</label>
                </div>

                <div class="section-title">Configuração de Camas</div>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="tiposCama" value="SOLTEIRO"> Solteiro</label>
                    <label><input type="checkbox" name="tiposCama" value="CASAL_KING"> Casal King</label>
                    <label><input type="checkbox" name="tiposCama" value="CASAL_QUEEN"> Casal Queen</label>
                </div>

                <div class="form-actions">
                    <button type="button" id="btnCancelar" class="btn btn-outline">Cancelar</button>
                    <button type="submit" class="btn btn-blue">Salvar Quarto</button>
                </div>
            </form>
        </section>

        <!-- Listagem de Quartos -->
        <section class="card mt-2">
            <h2>Lista de Quartos</h2>
            <div class="table-responsive">
                <table id="quartosTable">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Tipo</th>
                            <th>Preço/Diária</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaQuartosBody">
                        <!-- Conteúdo via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
